name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify Swagger editor methods and session configuration
        run: node scripts/test-swagger-config.cjs
      - name: Test additive demo sermon seeder
        run: node --test scripts/seed-demo-sermons.test.mjs
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with disposable PostgreSQL and race detector
        run: go test -race ./... -count=1 -timeout=5m

      - name: Build Docker image
        run: docker build --tag city4christ:verify .
      - name: Verify container startup and forward migrations with disposable PostgreSQL
        run: bash scripts/docker-smoke.sh city4christ:verify

      - name: Export the smoke-tested API image for main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/city4christ-api-image"
          mkdir -p "$artifact_dir"
          docker save city4christ:verify | gzip -1 > "$artifact_dir/city4christ-api.tar.gz"
          (cd "$artifact_dir" && sha256sum city4christ-api.tar.gz > city4christ-api.tar.gz.sha256)
      - name: Keep the tested image briefly for the gated VPS deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: city4christ-api-${{ github.sha }}
          path: ${{ runner.temp }}/city4christ-api-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
