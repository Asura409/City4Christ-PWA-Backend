name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with disposable PostgreSQL and race detector
        run: go test -race ./... -count=1 -timeout=5m

      - name: Build Docker image
        run: docker build --tag city4christ:verify .
      - name: Verify container startup and forward migrations with disposable PostgreSQL
        run: bash scripts/docker-smoke.sh city4christ:verify
