<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Title}}</title></head>
<body style="margin:0;background:#f5f0f7;font-family:Arial,sans-serif;color:#2B0831">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" style="max-width:560px;background:#fff;border-radius:16px" cellpadding="0" cellspacing="0">
<tr><td style="padding:28px;background:#542361;color:#fff;border-radius:16px 16px 0 0;font-size:24px;font-weight:bold">City4Christ</td></tr>
<tr><td style="padding:28px"><h1 style="font-size:24px;line-height:1.3;margin:0 0 20px">{{.Title}}</h1><p style="line-height:1.7">{{.Description}}</p>
{{if .ResetURL}}<p style="margin:28px 0"><a href="{{.ResetURL}}" style="display:inline-block;padding:16px 24px;background:#542361;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold">Reset password</a></p><p style="font-size:14px;line-height:1.6">Expires {{.Expiry}}. If you did not request this, ignore this email. Your password has not changed.</p><p style="font-size:12px;overflow-wrap:anywhere">Button not working? Copy this link into your browser:<br><a href="{{.ResetURL}}">{{.ResetURL}}</a></p>{{end}}
</td></tr><tr><td style="padding:0 28px 28px;color:#725e7b;font-size:13px">A community growing in faith.</td></tr></table>
</td></tr></table></body></html>
